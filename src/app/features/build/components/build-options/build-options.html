<div class="build-options">
  <div class="build-options__buttons">
    <div class="build-options__group">
      <button
        class="build-options__btn"
        (click)="openPopup('share', $event)"
        appTooltip
        [tooltipText]="'Share'"
        tooltipPlacement="top"
        aria-label="Share build"
      >
        <ng-icon name="phosphorShareNetwork" />
      </button>
      <button
        class="build-options__btn"
        (click)="openPopup('ai-prompt', $event)"
        appTooltip
        [tooltipText]="'AI Prompt'"
        tooltipPlacement="top"
        aria-label="Generate AI prompt"
      >
        <ng-icon name="phosphorHeadCircuit" />
      </button>
    </div>
    <button
      class="build-options__btn build-options__btn--danger"
      (click)="openPopup('reset', $event)"
      appTooltip
      [tooltipText]="'Reset'"
      tooltipPlacement="top"
      aria-label="Reset build"
    >
      <ng-icon name="phosphorTrash" />
    </button>
  </div>
</div>
