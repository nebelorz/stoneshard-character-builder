<div class="right-sidenav__extras">
  <div class="right-sidenav__extras-header">
    <span class="right-sidenav__extras-title font-fantasy" role="heading" aria-level="2"
      >Notes</span
    >
  </div>
  <div class="right-sidenav__extras-content">
    <div class="right-sidenav__extras-row--notes" (click)="openNotes.emit()">
      @if (notesPreview(); as preview) {
        <span class="right-sidenav__extras-notes-title"
          >▸ Name: {{ preview.buildName || '--' }}</span
        >
        <span class="right-sidenav__extras-notes-author"
          >▸ Author: {{ preview.author || '--' }}</span
        >
        <span class="right-sidenav__extras-notes-preview"
          >▸ Notes: {{ preview.contentPreview || '--' }}</span
        >
      } @else {
        <span class="right-sidenav__extras-notes-placeholder">Add notes for this build</span>
      }
    </div>
  </div>
</div>
